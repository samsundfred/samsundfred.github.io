<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Relationship Explorer Results</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
padding:30px;

background:
linear-gradient(135deg,#ec4899,#7c3aed,#06b6d4);

min-height:100vh;

color:white;

}


.container{

max-width:1000px;

margin:auto;

background:
rgba(255,255,255,.15);

backdrop-filter:blur(15px);

padding:35px;

border-radius:25px;

}



h1,h2{

text-align:center;

}



.card{

background:white;

color:#222;

border-radius:20px;

padding:25px;

margin:20px 0;

}



.match{

margin:20px 0;

}



.bar{

height:22px;

background:#ddd;

border-radius:20px;

overflow:hidden;

}


.fill{

height:100%;

background:
linear-gradient(90deg,#ec4899,#7c3aed);

}



.tag{

display:inline-block;

padding:8px 15px;

background:#facc15;

border-radius:30px;

color:#111;

font-weight:bold;

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}


.small-card{

background:#f3f4f6;

padding:20px;

border-radius:15px;

color:#222;

}


a{

color:#7c3aed;

font-weight:bold;

}


</style>

</head>


<body>


<div class="container">


<h1>
❤️ Your Relationship Explorer Results
</h1>


<p style="text-align:center">

Your results show which relationship structures
share the most similarities with your answers.

They are possibilities to explore, not labels.

</p>



<div id="results"></div>



</div>



<script src="data/relationship-types.js"></script>

<script src="js/results.js"></script>


</body>

</html>
